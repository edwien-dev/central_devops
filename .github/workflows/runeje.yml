name: ejecuta mi action  


on:
  workflow_dispatch:
  workflow_call:
jobs:
  build:
    runs-on: ['arc-normaliza-runner-set']
    env:
      DOCKERHUB_USER: jeanedwien            
      DOCKERHUB_TOKEN: dckr_pat_i9ZRM2ElK8an5jO7w7BaKAaa440
      IMAGE_NAME: miapp                     
      IMAGE_TAG: latest  
    steps:
      - name: 🧹 Checkout del repositorio
        uses: actions/checkout@v4

      - name: Usar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Mostrar versión de Node
        run: node -v

      - name: Install dependencies
        run: npm install

      - name: Build Angular App
        id: build
        run: |
          OUTPUT=$(npx ng build | grep "Output location:" | sed 's/Output location: //')
          echo "dist_path=$OUTPUT" >> $GITHUB_OUTPUT

      - name: Show dist path
        run: echo "El dist quedó en: ${{ steps.build.outputs.dist_path }}"
