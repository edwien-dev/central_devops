name: Build and Push Image

on:
  workflow_dispatch:
  workflow_call:

jobs:
  build:
    runs-on: self-hosted   # o ubuntu-latest si usas runner GitHub

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Configurar buildx (BuildKit)
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # Login al registry (Docker Hub en este caso)
      - name: Docker Login
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Build y Push
      - name: Build & Push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/mi-app:latest
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/mi-app:${{ github.sha }}