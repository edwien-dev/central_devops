name: ejecuta mi action  


on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ['arc-normaliza-runner-set']
    steps:
      - name: 🧹 Checkout del repositorio
        uses: actions/checkout@v4

      - name: 🧩 Validar Azure CLI
        run: |
          echo "🔹 Versión de Azure CLI:"
          az version
          echo "🔹 Autenticando con Azure (modo dry-run):"
          az cloud list --output table
          echo "✅ Azure CLI disponible y funcional."

      - name: 🧱 Validar Podman
        run: |
          echo "🔹 Versión de Podman:"
          podman --version
          
          podman build -t test-podman .
          echo "✅ Build con Podman completado."

      - name: 🧹 Limpieza de imágenes Podman
        run: |
          podman image prune -a -f
          echo "✅ Espacio liberado."

