name: ejecuta mi action  


on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ['arc-normaliza-runner-set']
    env:
      DOCKERHUB_USER: jeanedwien            
      DOCKERHUB_TOKEN: dckr_pat_i9ZRM2ElK8an5jO7w7BaKAaa440
      IMAGE_NAME: miapp                     
      IMAGE_TAG: latest  
    steps:
      - name: 🧹 Checkout del repositorio
        uses: actions/checkout@v4

      - name: Usar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Mostrar versión de Node
        run: node -v

      - name: Usar Java 22
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '22'

      - name: Mostrar versión de Java
        run: java -version

      - name: Ver versión de kubectl
        run: kubectl version --client

      - name: Log in to Docker Hub
        run: |
          podman login docker.io -u "$DOCKERHUB_USER" -p "$DOCKERHUB_TOKEN"

      - name: Build image with Podman
        run: |
          podman build -t docker.io/$DOCKERHUB_USER/$IMAGE_NAME:$IMAGE_TAG .

      - name: Push image to Docker Hub
        run: |
          podman push docker.io/$DOCKERHUB_USER/$IMAGE_NAME:$IMAGE_TAG
